<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motor de Diagnostico Pro</title>
    <style>
        /* Estilos base */
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #121212; color: #fff; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        /* Panel Izquierdo */
        .sidebar { 
            width: 300px; 
            min-width: 300px; 
            flex-shrink: 0; 
            background-color: #1e1e1e; 
            padding: 20px; 
            box-sizing: border-box;
            box-shadow: 2px 0 5px rgba(0,0,0,0.5); 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
            z-index: 10;
            overflow-y: auto;
        }
        /* Ajuste para la barra de desplazamiento del panel izquierdo */
        .sidebar::-webkit-scrollbar { width: 8px; }
        .sidebar::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }
        .sidebar::-webkit-scrollbar-track { background: #1e1e1e; }

        h2 { color: #00ff88; margin-top: 0; font-size: 1.4rem;}
        label { font-size: 0.9rem; color: #aaa; }
        input { width: 100%; padding: 10px; border: 1px solid #333; border-radius: 5px; background-color: #2d2d2d; color: white; margin-bottom: 10px; box-sizing: border-box;}
        button { padding: 10px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-raiz { background-color: #00ff88; color: #000; } .btn-raiz:hover { background-color: #00cc6a; }
        .btn-izq { background-color: #ff3366; color: white; font-size: 0.85rem;} .btn-der { background-color: #33aaff; color: white; font-size: 0.85rem;}
        .btn-reconstruir { background-color: #ffaa00; color: #000; } .btn-reconstruir:hover { background-color: #e69900; }
        
        /* Area Central (Canvas) */
        .main-content { 
            flex-grow: 1; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden;
        }
        
        /* Contenedor del arbol */
        .tree-container { 
            flex-grow: 1; 
            background-color: #1a1a1a; 
            border: 2px dashed #333; 
            border-radius: 10px; 
            overflow: auto; 
        }
        
        /* Modulos Inferiores */
        .recorridos-panel { margin-top: 20px; background-color: #1e1e1e; padding: 15px; border-radius: 10px; flex-shrink: 0;}
        .recorridos-btn-group { display: flex; gap: 10px; margin-bottom: 10px; }
        .btn-rec { background-color: #444; color: white; flex-grow: 1; } .btn-rec:hover { background-color: #555; }
        .resultado-box { background-color: #000; padding: 10px; border-radius: 5px; font-family: monospace; color: #00ff88; min-height: 20px; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>Motor de Diagnostico</h2>
        
        <div>
            <label>Niveles (niveles del arbol):</label>
            <input type="number" id="input-niveles" value="10" min="1" max="10">
            <button class="btn-raiz" onclick="iniciarTorneo()" style="width: 100%;">Iniciar Nuevo Diagnostico</button>
        </div>
        <hr style="border-color: #333; width: 100%;">
        <div>
            <label>Nodo Raiz:</label>
            <input type="text" id="input-valor" placeholder="Ej. pc">
            <button class="btn-raiz" onclick="insertarRaiz()" style="width: 100%; margin-bottom: 15px;">Establecer punto Inicial (Raiz)</button>
        </div>
        <div>
            <label>Nodo Padre (Poner el nodo anterior; nodo raiz):</label>
            <input type="text" id="input-padre" placeholder="Ej. pc">
            <div style="display: flex; gap: 10px;">
                <button class="btn-izq" onclick="insertarHijo('I')" style="flex-grow: 1;">Asignar Izq</button>
                <button class="btn-der" onclick="insertarHijo('D')" style="flex-grow: 1;">Asignar Der</button>
            </div>
        </div>

        <hr style="border-color: #333; width: 100%;">
        
        <div>
            <h3 style="color: #ffaa00; margin-top: 0; margin-bottom: 10px; font-size: 1.1rem;">Reconstruir Arbol </h3>
            <label>Secuencia Preorden (separa con comas):</label>
            <input type="text" id="input-preorden" placeholder="Ej. pc, 1, 3, 2">
            
            <label>Secuencia Inorden (separa con comas):</label>
            <input type="text" id="input-inorden" placeholder="Ej. 3, 1, pc, 2">
            
            <button class="btn-reconstruir" onclick="ejecutarReconstruccion()" style="width: 100%;">Reconstruir Arbol</button>
        </div>
    </div>

    <div class="main-content">
        <div class="tree-container" id="scroll-container">
            <canvas id="canvas-arbol" width="2000" height="1000"></canvas>
        </div>

        <div class="recorridos-panel">
            <h3 style="margin-top: 0; color: #aaa;">elegir orden</h3>
            <div class="recorridos-btn-group">
                <button class="btn-rec" onclick="pedirRecorridos('preorden')">Preorden</button>
                <button class="btn-rec" onclick="pedirRecorridos('inorden')">Inorden</button>
                <button class="btn-rec" onclick="pedirRecorridos('postorden')">Postorden</button>
            </div>
            <div class="resultado-box" id="resultado-texto">Esperando recorrido...</div>
        </div>
    </div>

    <script>
        // API URL para cambiar si falla vercel como tercera vez :)
        const API_URL = "/api";
        const canvas = document.getElementById('canvas-arbol');
        const ctx = canvas.getContext('2d');
        const scrollContainer = document.getElementById('scroll-container');

        window.onload = () => {
            scrollContainer.scrollLeft = (canvas.width - scrollContainer.clientWidth) / 2;
        };

        function obtenerProfundidad(nodo) {
            if (!nodo) return 0;
            return 1 + Math.max(obtenerProfundidad(nodo.izquierdo), Math.max(obtenerProfundidad(nodo.derecho)));
        }

        function obtenerAnchoMaximo(nodo) {
            if (!nodo) return 0;
            ctx.font = '14px Arial';
            const anchoBase = Math.max(100, ctx.measureText(nodo.valor).width + 30);
            return Math.max(anchoBase, obtenerAnchoMaximo(nodo.izquierdo), obtenerAnchoMaximo(nodo.derecho));
        }

        // Centralizamos la logica matematica para dibujar cualquier arbol (normal o reconstruido)
        function dibujarEstructura(data) {
            if (data) {
                const profundidad = obtenerProfundidad(data);
                const anchoMaximo = obtenerAnchoMaximo(data);
                
                let separacionInicial = 0;
                if (profundidad > 1) {
                    separacionInicial = Math.pow(2, Math.max(0, profundidad - 2)) * ((anchoMaximo / 2) + 15);
                }

                const anchoNecesario = (separacionInicial * 4.5) + anchoMaximo + 100;
                canvas.width = Math.max(2000, anchoNecesario);
                canvas.height = Math.max(1000, profundidad * 120 + 100);

                ctx.clearRect(0, 0, canvas.width, canvas.height);
                dibujarNodo(data, canvas.width / 2, 50, separacionInicial);
                scrollContainer.scrollLeft = (canvas.width - scrollContainer.clientWidth) / 2;
            } else {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
        }

        async function renderizarArbol() {
            const response = await fetch(`${API_URL}/estructura`);
            const data = await response.json();
            dibujarEstructura(data);
        }

        function dibujarNodo(nodo, x, y, separacion) {
            if (!nodo) return;

            ctx.font = '14px Arial'; 
            const textoAncho = ctx.measureText(nodo.valor).width;
            const ancho = Math.max(100, textoAncho + 30); 
            const alto = 35;

            if (nodo.izquierdo) {
                ctx.beginPath();
                ctx.moveTo(x, y + 17);
                ctx.lineTo(x - separacion, y + 100);
                ctx.strokeStyle = '#555';
                ctx.lineWidth = 2;
                ctx.stroke();
                dibujarNodo(nodo.izquierdo, x - separacion, y + 100, separacion / 2);
            }
            if (nodo.derecho) {
                ctx.beginPath();
                ctx.moveTo(x, y + 17);
                ctx.lineTo(x + separacion, y + 100);
                ctx.strokeStyle = '#555';
                ctx.lineWidth = 2;
                ctx.stroke();
                dibujarNodo(nodo.derecho, x + separacion, y + 100, separacion / 2);
            }

            ctx.fillStyle = '#1e1e1e';
            ctx.fillRect(x - (ancho/2), y, ancho, alto);
            ctx.strokeStyle = '#ffaa00'; // Bordes naranja para diferenciar que es una reconstruccion (opcional, le da estilo)
            ctx.lineWidth = 2;
            ctx.strokeRect(x - (ancho/2), y, ancho, alto);

            ctx.fillStyle = '#ffffff';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(nodo.valor, x, y + (alto/2));
        }

        async function iniciarTorneo() {
            const niveles = document.getElementById('input-niveles').value;
            await fetch(`${API_URL}/iniciar`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ niveles: parseInt(niveles) })
            });
            renderizarArbol();
            document.getElementById('resultado-texto').innerText = "Diagnostico limpio. Esperando recorrido";
        }

        async function insertarRaiz() {
            const valor = document.getElementById('input-valor').value;
            const res = await fetch(`${API_URL}/insertar/raiz`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ valor: valor })
            });
            if(res.ok) {
                document.getElementById('input-valor').value = ""; 
                renderizarArbol();
            } else {
                alert((await res.json()).detail);
            }
        }

        async function insertarHijo(direccion) {
            const valor = document.getElementById('input-valor').value;
            const padre = document.getElementById('input-padre').value;
            const res = await fetch(`${API_URL}/insertar/hijo`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ padre: padre, valor: valor, direccion: direccion })
            });
            if(res.ok) {
                document.getElementById('input-valor').value = ""; 
                renderizarArbol();
            } else {
                alert((await res.json()).detail);
            }
        }

        async function pedirRecorridos(tipo) {
            const response = await fetch(`${API_URL}/recorridos`);
            if(response.ok) {
                const data = await response.json();
                document.getElementById('resultado-texto').innerText = data[tipo].join(" ➔ ");
            }
        }

  
        // RECONSTRUCCION DESDE UI
        async function ejecutarReconstruccion() {
            // Obtenemos los textos de las nuevas cajas
            const txtPre = document.getElementById('input-preorden').value;
            const txtIn = document.getElementById('input-inorden').value;

            if (!txtPre || !txtIn) {
                alert("llena ambas secuencias separadas por comas.");
                return;
            }

            // Convertimos el texto en un arreglo eliminando espacios extra
            const arrPre = txtPre.split(',').map(item => item.trim());
            const arrIn = txtIn.split(',').map(item => item.trim());

            // Hacemos la peticion a tu servidor Python
            const res = await fetch(`${API_URL}/reconstruir`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ preorden: arrPre, inorden: arrIn })
            });

            if(res.ok) {
                const data = await res.json();
                // Dibuja la esctuctura 
                dibujarEstructura(data);
                document.getElementById('resultado-texto').innerText = "arbol reconstruido";
            } else {
                const error = await res.json();
                alert(error.detail);
            }
        }
    </script>
</body>
</html>
